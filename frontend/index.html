<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse - The Real-Time Microblogging Engine</title>

    <!-- PKG-12: PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#385898" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />

    <script>
      // PKG-02: chống FOUC — áp theme trước khi React hydrate.
      (function () {
        try {
          var mode = localStorage.getItem('pulse_theme');
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          else if (mode === 'black') document.documentElement.classList.add('black');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink min-h-screen antialiased selection:bg-meta/15 selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
